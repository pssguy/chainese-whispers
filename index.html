<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chainese Whispers</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #f7f4fb 0%, #ede7f3 40%, #e6dded 100%);
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    padding: 24px 12px;
    color: #3a2e50;
  }

  .container { max-width: 560px; margin: 0 auto; }

  h1 {
    font-family: 'Caveat', cursive;
    font-size: 44px;
    font-weight: 700;
    text-align: center;
    color: #3a2e50;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: #8a80a0;
    font-size: 13px;
    margin-bottom: 18px;
  }

  /* Illustration */
  .illo { display: block; margin: 0 auto 20px; max-width: 480px; width: 100%; }

  /* Cards */
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 20px rgba(90,70,120,0.08);
    margin-bottom: 14px;
  }

  label.field-label {
    font-size: 11px;
    color: #9a90a8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    border: 1.5px solid #e0dae8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: 'Caveat', cursive;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #b8a9c9; }

  /* Controls row */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  select {
    flex: 1;
    min-width: 140px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid #e0dae8;
    font-size: 14px;
    outline: none;
    background: #faf8fd;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary {
    padding: 9px 20px;
    border-radius: 8px;
    border: none;
    background: #6b5b8a;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .btn-primary:hover { background: #5a4a78; }
  .btn-primary:disabled { background: #c4bbd4; cursor: wait; }

  .btn-outline {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid #6b5b8a;
    background: transparent;
    color: #6b5b8a;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-outline:disabled { opacity: 0.5; cursor: wait; }

  .btn-small {
    font-size: 12px;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
  }

  /* Chain display */
  .chain-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .chain-label {
    font-size: 12px;
    color: #9a90a8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .original-quote {
    font-size: 13px;
    color: #8a80a0;
    padding: 6px 10px;
    background: #faf8fd;
    border-radius: 6px;
    font-style: italic;
    margin-bottom: 12px;
  }

  .step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeSlide 0.4s ease both;
  }

  .step-dot-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 36px;
  }

  .step-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  .step-dot.normal { background: #d4cde2; color: #5a5070; }
  .step-dot.final  { background: #6b5b8a; color: #fff; }

  .step-line { width: 2px; height: 24px; background: #e0dae8; }

  .step-lang {
    font-size: 11px;
    color: #9a90a8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .step-text {
    font-size: 15px;
    color: #5a5070;
    font-family: 'Caveat', cursive;
    line-height: 1.5;
  }

  .step-text.final {
    color: #3a2e50;
    font-weight: 700;
    background: #f0ecf5;
    padding: 6px 10px;
    border-radius: 6px;
  }

  /* Verdict */
  .verdict {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, #f0ecf5, #e8e0f0);
    border: 1.5px dashed #c4bbd4;
  }
  .verdict-title {
    font-size: 11px;
    color: #6b5b8a;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .verdict-body {
    font-size: 13px;
    color: #5a5070;
    line-height: 1.6;
  }

  .error-msg {
    background: #fdf0f0;
    color: #8a3a3a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #b0a8ba;
    margin-top: 10px;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Chainese Whispers</h1>
  <p class="subtitle">Translate through languages. See what survives.</p>

  <!-- Illustration -->
  <svg class="illo" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b8a9c9"/>
      </marker>
    </defs>
    <g><circle cx="60" cy="55" r="22" fill="hsl(30,55%,72%)" stroke="hsl(30,40%,45%)" stroke-width="2"/><circle cx="65" cy="50" r="2.5" fill="hsl(30,40%,30%)"/><ellipse cx="78" cy="58" rx="5" ry="3" fill="hsl(30,40%,45%)" opacity=".6"/><path d="M85 55Q110 45,135 55" fill="none" stroke="hsl(60,50%,65%)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><path d="M85 60Q110 70,135 60" fill="none" stroke="hsl(60,50%,65%)" stroke-width="1" stroke-dasharray="2 4" opacity=".4"/><text x="60" y="90" text-anchor="middle" font-size="9" fill="#8a8a9a" font-family="Caveat,cursive">EN</text></g>
    <g><circle cx="160" cy="55" r="22" fill="hsl(95,55%,72%)" stroke="hsl(95,40%,45%)" stroke-width="2"/><circle cx="165" cy="50" r="2.5" fill="hsl(95,40%,30%)"/><ellipse cx="178" cy="58" rx="5" ry="3" fill="hsl(95,40%,45%)" opacity=".6"/><path d="M185 55Q210 45,235 55" fill="none" stroke="hsl(125,50%,65%)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><path d="M185 60Q210 70,235 60" fill="none" stroke="hsl(125,50%,65%)" stroke-width="1" stroke-dasharray="2 4" opacity=".4"/><text x="160" y="90" text-anchor="middle" font-size="9" fill="#8a8a9a" font-family="Caveat,cursive">FR</text></g>
    <g><circle cx="260" cy="55" r="22" fill="hsl(160,55%,72%)" stroke="hsl(160,40%,45%)" stroke-width="2"/><circle cx="265" cy="50" r="2.5" fill="hsl(160,40%,30%)"/><ellipse cx="278" cy="58" rx="5" ry="3" fill="hsl(160,40%,45%)" opacity=".6"/><path d="M285 55Q310 45,335 55" fill="none" stroke="hsl(190,50%,65%)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><path d="M285 60Q310 70,335 60" fill="none" stroke="hsl(190,50%,65%)" stroke-width="1" stroke-dasharray="2 4" opacity=".4"/><text x="260" y="90" text-anchor="middle" font-size="9" fill="#8a8a9a" font-family="Caveat,cursive">日本</text></g>
    <g><circle cx="360" cy="55" r="22" fill="hsl(225,55%,72%)" stroke="hsl(225,40%,45%)" stroke-width="2"/><circle cx="365" cy="50" r="2.5" fill="hsl(225,40%,30%)"/><ellipse cx="378" cy="58" rx="5" ry="3" fill="hsl(225,40%,45%)" opacity=".6"/><path d="M385 55Q410 45,435 55" fill="none" stroke="hsl(255,50%,65%)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><path d="M385 60Q410 70,435 60" fill="none" stroke="hsl(255,50%,65%)" stroke-width="1" stroke-dasharray="2 4" opacity=".4"/><text x="360" y="90" text-anchor="middle" font-size="9" fill="#8a8a9a" font-family="Caveat,cursive">DE</text></g>
    <g><circle cx="460" cy="55" r="22" fill="hsl(290,55%,72%)" stroke="hsl(290,40%,45%)" stroke-width="2"/><circle cx="465" cy="50" r="2.5" fill="hsl(290,40%,30%)"/><text x="460" y="90" text-anchor="middle" font-size="9" fill="#8a8a9a" font-family="Caveat,cursive">EN</text></g>
    <path d="M470 40Q490-10,260-15Q30-10,50 35" fill="none" stroke="#b8a9c9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  </svg>

  <!-- Input -->
  <div class="card">
    <label class="field-label" for="inputText">Starting text — enter or paste</label>
    <textarea id="inputText" rows="2" placeholder="What goes around, comes around"></textarea>
  </div>

  <!-- Controls -->
  <div class="card controls" id="controlsCard">
    <select id="langSelect"></select>
    <button class="btn-primary" id="translateBtn" onclick="doTranslate()">Translate →</button>
  </div>

  <!-- Chain output -->
  <div class="card" id="chainCard" style="display:none;">
    <div class="chain-header">
      <span class="chain-label" id="chainLabel"></span>
      <div style="display:flex;gap:8px;">
        <button class="btn-small" style="color:#6b5b8a;background:#f0ecf5;" onclick="downloadChain()">↓ Download</button>
        <button class="btn-small" style="color:#a0909a;background:#f5f3f7;" onclick="resetChain()">Reset</button>
      </div>
    </div>
    <div class="original-quote" id="originalQuote"></div>
    <div id="chainSteps"></div>
    <div id="verdictBox"></div>
  </div>

  <div id="errorBox"></div>

  <p class="footer">Powered by Gemini · Each translation is independent — meaning drifts with every whisper</p>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION — Paste your Gemini API key below
// ═══════════════════════════════════════════════════════════
const GEMINI_API_KEY = "AIzaSyAX9gfQXL42xDWA6y7d_diGb5EOdX7j4D8";
const GEMINI_MODEL  = "gemini-2.0-flash-lite";
// ═══════════════════════════════════════════════════════════

const LANGUAGES = [
  "English","French","Spanish","German","Japanese","Mandarin Chinese","Korean",
  "Russian","Arabic","Hindi","Portuguese","Italian","Swedish",
  "Turkish","Thai","Vietnamese","Swahili","Greek","Dutch",
  "Polish","Hebrew","Indonesian","Czech","Finnish","Norwegian"
];

let chain = [];

const inputEl     = document.getElementById('inputText');
const langSelect  = document.getElementById('langSelect');
const translateBtn= document.getElementById('translateBtn');
const chainCard   = document.getElementById('chainCard');
const chainSteps  = document.getElementById('chainSteps');
const chainLabel  = document.getElementById('chainLabel');
const originalQt  = document.getElementById('originalQuote');
const verdictBox  = document.getElementById('verdictBox');
const errorBox    = document.getElementById('errorBox');
const controlsCard= document.getElementById('controlsCard');

// Populate language dropdown
function populateLanguages() {
  const currentLang = chain.length > 0 ? chain[chain.length-1].language : "English";
  const used = chain.map(s => s.language);
  langSelect.innerHTML = "";
  LANGUAGES.filter(l => l !== currentLang).forEach(l => {
    const opt = document.createElement("option");
    opt.value = l;
    opt.textContent = l + (used.includes(l) ? " ✓" : "");
    langSelect.appendChild(opt);
  });
}
populateLanguages();

// Show/hide "Back to English" button
function updateControls() {
  const currentLang = chain.length > 0 ? chain[chain.length-1].language : "English";
  let homeBtn = document.getElementById('homeBtnEl');
  if (chain.length > 0 && currentLang !== "English") {
    if (!homeBtn) {
      homeBtn = document.createElement("button");
      homeBtn.id = "homeBtnEl";
      homeBtn.className = "btn-outline";
      homeBtn.textContent = "↩ Back to English";
      homeBtn.onclick = bringItHome;
      controlsCard.appendChild(homeBtn);
    }
  } else if (homeBtn) {
    homeBtn.remove();
  }
}

function getOriginalText() {
  return getOriginalText() || inputEl.placeholder;
}

function getCurrentText() {
  const val = chain.length > 0 ? chain[chain.length-1].text : getOriginalText();
  return val || inputEl.placeholder;
}

function getCurrentLang() {
  return chain.length > 0 ? chain[chain.length-1].language : "English";
}

async function callGemini(prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${resp.status}`);
  }
  const data = await resp.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
}

async function doTranslate() {
  const text = getCurrentText();
  const fromLang = getCurrentLang();
  const toLang = langSelect.value;
  if (!text) return;

  setLoading(true);
  errorBox.innerHTML = "";

  try {
    const prompt = `Translate the following text from ${fromLang} to ${toLang}. Return ONLY the translated text, nothing else. No quotes, no explanation.\n\nText: ${text}`;
    const result = await callGemini(prompt);
    if (!result) throw new Error("No translation returned");
    chain.push({ language: toLang, text: result });
    renderChain();
    populateLanguages();
    updateControls();
  } catch (e) {
    errorBox.innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
  setLoading(false);
}

async function bringItHome() {
  const text = getCurrentText();
  const fromLang = getCurrentLang();
  if (fromLang === "English") return;

  setLoading(true);
  errorBox.innerHTML = "";

  try {
    const prompt = `Translate the following text from ${fromLang} back to English. Return ONLY the translated text, nothing else. No quotes, no explanation.\n\nText: ${text}`;
    const result = await callGemini(prompt);
    if (!result) throw new Error("No translation returned");
    chain.push({ language: "English", text: result });
    renderChain();
    populateLanguages();
    updateControls();
  } catch (e) {
    errorBox.innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
  setLoading(false);
}

function setLoading(on) {
  translateBtn.disabled = on;
  translateBtn.textContent = on ? "Whispering…" : "Translate →";
  const hb = document.getElementById('homeBtnEl');
  if (hb) hb.disabled = on;
}

function renderChain() {
  chainCard.style.display = "block";
  chainLabel.textContent = `Translation Chain (${chain.length} step${chain.length>1?"s":""})`;
  originalQt.textContent = `Original: "${getOriginalText()}"`;

  chainSteps.innerHTML = "";
  chain.forEach((step, i) => {
    const isLast = i === chain.length - 1;
    const div = document.createElement("div");
    div.className = "step";
    div.style.animationDelay = `${i * 0.08}s`;
    div.innerHTML = `
      <div class="step-dot-col">
        <div class="step-dot ${isLast ? 'final' : 'normal'}">${i+1}</div>
        ${!isLast ? '<div class="step-line"></div>' : ''}
      </div>
      <div style="flex:1;padding-bottom:${isLast?0:8}px">
        <div class="step-lang">${step.language}</div>
        <div class="step-text ${isLast ? 'final' : ''}">${step.text}</div>
      </div>`;
    chainSteps.appendChild(div);
  });

  // Verdict
  const last = chain[chain.length-1];
  if (chain.length > 1 && last.language === "English") {
    verdictBox.innerHTML = `
      <div class="verdict">
        <div class="verdict-title">🔄 The Verdict</div>
        <div class="verdict-body">
          <strong>Started with:</strong> "${getOriginalText()}"<br>
          <strong>Ended with:</strong> "${last.text}"
        </div>
      </div>`;
  } else {
    verdictBox.innerHTML = "";
  }
}

function resetChain() {
  chain = [];
  chainCard.style.display = "none";
  chainSteps.innerHTML = "";
  verdictBox.innerHTML = "";
  errorBox.innerHTML = "";
  populateLanguages();
  updateControls();
}

function downloadChain() {
  const lines = ["CHAINESE WHISPERS", `Original: "${getOriginalText()}"`, ""];
  chain.forEach((s, i) => lines.push(`${i+1}. [${s.language}] ${s.text}`));
  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chainese-whispers.txt";
  a.click();
}

// Reset chain if user edits the input
inputEl.addEventListener('input', resetChain);
</script>
</body>
</html>
